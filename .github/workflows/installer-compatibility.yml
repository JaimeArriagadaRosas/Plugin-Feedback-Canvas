name: Installer Docker Compatibility

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/installer/**'
      - '.github/workflows/installer-compatibility.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/installer/**'
      - '.github/workflows/installer-compatibility.yml'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Installer Unit Tests
        run: npx vitest run --project @plugin-feedback/installer
