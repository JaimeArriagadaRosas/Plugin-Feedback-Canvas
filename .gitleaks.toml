title = "Plugin Feedback Canvas secret scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Solo fixtures y artefactos no ejecutables con falsos positivos conocidos."
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.env(\.[^.]+)?\.example$''',
  '''(^|/)apps/server/src/validation/rutas/config\.routes\.test\.js$''',
  '''(^|/)apps/server/src/validation/unit/config\.test\.js$'''
]
regexes = [
  '''[a-zA-Z0-9._%+-]+@canvas\.local''',
  '''(?i)(client_id|secret|token)[\s:=]+['"]?(example|test|mock)['"]?'''
]
